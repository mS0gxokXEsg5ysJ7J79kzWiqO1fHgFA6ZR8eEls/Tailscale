# ============================================================
# 工作流名称：Windows 云端 RDP 远程桌面
# 功能：在 GitHub Actions 上启动一台 Windows 虚拟机
#       开启 RDP，通过 Tailscale VPN 供外部连接
# ============================================================
name: Windows Cloud RDP

on:
  # 保留手动触发入口
  workflow_dispatch:
  # 每48小时自动重新触发一次（UTC时间）
  # 分 时 日 月 周
  schedule:
    - cron: '0 0 */2 * *'

jobs:
  build:
    # 使用最新版 Windows Server 虚拟机（2核 8GB RAM）
    runs-on: windows-latest

    # GitHub 保活时长
    timeout-minutes: 2880

    steps:

      # ============================================================
      # 第一步：开启远程桌面服务 + 放行防火墙
      # ============================================================
      - name: 0. Set Device Name
        run: Rename-Computer -NewName "TailscaleCloudPC" -Force

      - name: 1. Enable Remote Desktop & Firewall
        run: |
          # 修改注册表：将"拒绝RDP连接"从1改为0，即允许远程桌面连入
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0

          # 启用 Windows 防火墙中"远程桌面"规则组，开放 TCP 3389 端口
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 关闭网络级别身份验证（NLA）
          # NLA=1 要求连接前先验证身份（更安全但兼容性差）
          # NLA=0 直接进登录界面，兼容老版 mstsc 客户端
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

      # ============================================================
      # 第二步：创建专用管理员账号
      # ============================================================
      - name: 2. Create Admin Account
        env:
          WINDOWS_RDP_PASSWORD: ${{ secrets.WINDOWS_RDP_PASSWORD }}
        run: |
          # 将明文密码转为 PowerShell 安全字符串对象（New-LocalUser 要求此格式）
          $Password = ConvertTo-SecureString "$Env:WINDOWS_RDP_PASSWORD" -AsPlainText -Force

          # 创建本地用户 Admin，密码永不过期
          # -ErrorAction SilentlyContinue：若用户已存在则静默跳过，不报错中断
          New-LocalUser -Name "Admin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue

          # 将 Admin 加入本地管理员组，获得完整系统权限
          Add-LocalGroupMember -Group "Administrators" -Member "Admin" -ErrorAction SilentlyContinue

          # 同时修改 GitHub Actions 自带的 runneradmin 账号密码
          # 这样两个账号都能用同一个密码登录 RDP
          net user runneradmin "$Env:WINDOWS_RDP_PASSWORD"

      # ============================================================
      # 第三步：安装 Tailscale VPN 并建立隧道
      # 原因：GitHub Actions 的 3389 端口不对外暴露
      #       必须借助 Tailscale 私有网络才能从外部连入
      # ============================================================
      - name: 3. Install & Connect Tailscale VPN
        env:
          # 从仓库 Secrets 读取 Tailscale 授权密钥，避免硬编码泄露
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # 下载 Tailscale 最新版 64位 MSI 安装包到 C 盘根目录
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"

          # 静默安装 Tailscale，/quiet 无界面，/norestart 安装后不重启
          # -Wait 等待安装进程完全结束再继续执行
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          # 等待5秒，确保 Tailscale 服务完成初始化启动
          Start-Sleep -Seconds 5

          # 使用授权密钥连接到你的 Tailscale 账号网络
          # --hostname 设置该节点在 Tailscale 控制台显示的名称
          # 固定 hostname 后可直接用 hostname 替代 IP 连接（更稳定）
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="GitHub-RDP-Server"

          # 等待8秒，让 Tailscale 完成握手并分配内网 IP
          Start-Sleep -Seconds 8

          # 获取本机在 Tailscale 网络中分配到的 IPv4 地址
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          # 打印连接信息到 Actions 日志，方便查看
          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : Admin" -ForegroundColor Yellow
          Write-Host "  Password     : $Env:WINDOWS_RDP_PASSWORD" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      # ============================================================
      # 第四步：循环保活
      # 原理：每60秒打印一次心跳日志，防止 Actions 因无输出被判定超时
      # 2880次 × 60秒 = 172800秒 = 48小时
      # ============================================================
      - name: 4. Keep Server Alive
        run: |
          # 计算本次任务到期时间（当前时间 + N分钟，留5分钟缓冲）
          $deadline = (Get-Date).AddMinutes(2875); $totalMinutes = 2875

          $i = 1
          # 循环直到接近超时时间为止
          while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 60
              # 打印当前时间 + 剩余时间，方便在日志中确认服务器状态
              $remaining = [int]($deadline - (Get-Date)).TotalMinutes
              Write-Host "[$i] $(Get-Date -Format 'HH:mm:ss') | 已运行 $i 分钟 / 共2875分钟 | 剩余约 $remaining 分钟 | Server running..."
              $i++
          }
          Write-Host "任务即将到达上限，本次48小时会话结束，等待下次 cron 自动触发。"
